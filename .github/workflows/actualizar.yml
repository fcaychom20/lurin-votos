name: Actualizar resultados

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 minutos
  workflow_dispatch:         # botón manual para probar

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Ejecutar recolector
        env:
          ONPE_URL: ${{ secrets.ONPE_URL }}
          DEMO: ${{ vars.DEMO }}
        run: mvn -q compile exec:java
      - name: Guardar cambios
        run: |
          git config user.name "bot-lurin"
          git config user.email "bot@users.noreply.github.com"
          git add docs/datos.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Actualización automática"
          git pull --rebase
          git push
